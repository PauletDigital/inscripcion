<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscripción — Concurso de Computación e Informática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12233F;--paper:#F2F5FA;--card:#fff;--line:#CBD5E4;--accent:#E8A100;--teal:#0F7B8A;--ok:#17663A;--bad:#A12B2B;--muted:#4C5B73}
@media (prefers-color-scheme:dark){:root:not([data-x]){--ink:#E8EEF8;--paper:#0D1626;--card:#15233A;--line:#2B3C58;--muted:#9FB0C9;--teal:#4CC3D3;--ok:#5BD08A;--bad:#FF8A8A}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:#12233F;color:#fff;padding:2.2rem 1rem 3.4rem;border-bottom:6px solid var(--accent)}
.wrap{max-width:640px;margin:0 auto}
header img{height:56px;margin-bottom:.8rem;display:none}
h1{font:800 clamp(1.7rem,6vw,2.5rem)/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 .5rem}
header p{margin:0;color:#C9D6EC}
#estado{display:inline-block;margin-top:1rem;padding:.25rem .8rem;border-radius:99px;background:rgba(255,255,255,.12);font-size:.95rem}
main{margin-top:-2rem;padding:0 1rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tabs button{flex:1;padding:.75rem;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 1rem inherit;border-radius:8px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
label{display:block;font-weight:600;margin:1rem 0 .3rem}
input,select{width:100%;padding:.7rem;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.check{display:flex;gap:.6rem;align-items:flex-start;font-weight:400;font-size:.92rem;color:var(--muted)}
.check input{width:auto;margin-top:.25rem}
.go{margin-top:1.2rem;width:100%;padding:.9rem;border:0;border-radius:8px;background:var(--accent);color:#12233F;font:700 1.05rem "Source Sans 3",sans-serif;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.msg{margin-top:1rem;padding:.8rem 1rem;border-radius:8px;border-left:5px solid}
.msg.bad{border-color:var(--bad);color:var(--bad);background:rgba(161,43,43,.08)}
.msg.good{border-color:var(--ok);color:var(--ok);background:rgba(23,102,58,.08)}
.hidden{display:none!important}
.constancia{text-align:center}
.codigo{font:800 2.4rem "Bricolage Grotesque",sans-serif;letter-spacing:.04em;margin:.3rem 0;color:var(--teal)}
.constancia button{margin:.4rem;padding:.6rem 1rem;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
small{color:var(--muted)}
@media print{header,.tabs,#f,#c,.constancia button,#estado{display:none!important}main{margin:0}}
</style>
</head>
<body>
<header><div class="wrap">
  <img id="logo" src="logo.png" alt="Logo" onload="this.style.display='block'">
  <h1>Concurso de Computación e Informática</h1>
  <p>Estudiantes de 1.° a 5.° de secundaria · II.EE. MSE-SFT</p>
  <span id="estado">Verificando inscripciones…</span>
</div></header>

<main><div class="wrap">
 <div class="tabs" role="tablist">
  <button role="tab" id="t1" aria-selected="true">Inscribirme</button>
  <button role="tab" id="t2" aria-selected="false">Consultar mi inscripción</button>
 </div>

 <section class="card" id="f">
  <form id="form" novalidate>
   <label for="dni">DNI</label>
   <input id="dni" inputmode="numeric" maxlength="8" autocomplete="off" required>
   <div class="row">
    <div><label for="apellidos">Apellidos</label><input id="apellidos" autocomplete="family-name" required></div>
    <div><label for="nombres">Nombres</label><input id="nombres" autocomplete="given-name" required></div>
   </div>
   <div class="row">
    <div><label for="grado">Grado</label>
     <select id="grado" required><option value="">Elegir…</option><option>1ero</option><option>2do</option><option>3ero</option><option>4to</option><option>5to</option></select></div>
    <div><label for="modalidad">Modalidad</label>
     <select id="modalidad" required><option value="">Elegir…</option><option>Público</option><option>Privado</option></select></div>
   </div>
   <label for="institucion">Institución educativa</label>
   <input id="institucion" required>
   <div class="row">
    <div><label for="correo">Correo electrónico</label><input id="correo" type="email" autocomplete="email" required></div>
    <div><label for="telefono">Teléfono / celular</label><input id="telefono" inputmode="numeric" maxlength="9" autocomplete="tel" required></div>
   </div>
   <label class="check"><input type="checkbox" id="acepto">
    <span>Autorizo el uso de mis datos personales únicamente para la organización del concurso, conforme a la Ley N.° 29733 de Protección de Datos Personales. Si soy menor de edad, cuento con la autorización de mi padre, madre o apoderado.</span></label>
   <button class="go" id="enviar" type="submit">Inscribirme</button>
   <div id="msg" class="msg hidden" role="alert"></div>
  </form>
 </section>

 <section class="card constancia hidden" id="ok" aria-live="polite">
  <h2 style="font-family:'Bricolage Grotesque',sans-serif;margin:0">Inscripción registrada</h2>
  <p id="okNombre" style="margin:.4rem 0"></p>
  <div class="codigo" id="okCodigo"></div>
  <small>Guarda este código. También lo enviamos a tu correo (revisa la carpeta de spam).</small><br>
  <button onclick="window.print()">Imprimir constancia</button>
  <button onclick="location.reload()">Nueva inscripción</button>
 </section>

 <section class="card hidden" id="c">
  <label for="dniC" style="margin-top:0">Ingresa tu DNI</label>
  <input id="dniC" inputmode="numeric" maxlength="8" autocomplete="off">
  <button class="go" id="buscar">Consultar</button>
  <div id="res" class="msg hidden" role="status"></div>
 </section>
</div></main>

<script>
/* ===== CONFIGURA ESTAS DOS LÍNEAS ===== */
const API = 'https://script.google.com/macros/s/AKfycbzyUQ78Y1pNCuvBypzcZtbwmUy4sP3YGSj_Xp0RkZ4pdmCGkEu4xcYsy_oH8WEaaqctTg/exec';       // termina en /exec
const CIERRE = new Date('2026-12-30T23:59:59-05:00'); // igual que en Code.gs
/* ====================================== */
const $ = id => document.getElementById(id);
const soloNum = e => e.target.value = e.target.value.replace(/\D/g,'');
['dni','dniC','telefono'].forEach(i => $(i).addEventListener('input', soloNum));

function mostrar(el, texto, tipo){ el.textContent = texto; el.className = 'msg ' + tipo; }
function cerrar(){
  $('estado').textContent = 'Inscripciones cerradas';
  $('form').querySelectorAll('input,select,button').forEach(x => x.disabled = true);
  mostrar($('msg'), 'Las inscripciones ya cerraron. Aún puedes consultar tu inscripción.', 'bad');
}
if(new Date() > CIERRE) cerrar();
else $('estado').textContent = 'Inscripciones abiertas hasta el ' + CIERRE.toLocaleDateString('es-PE',{day:'numeric',month:'long',year:'numeric'});

function tab(n){
  $('f').classList.toggle('hidden', n!==1); $('c').classList.toggle('hidden', n!==2);
  $('t1').setAttribute('aria-selected', n===1); $('t2').setAttribute('aria-selected', n===2);
}
$('t1').onclick = () => tab(1); $('t2').onclick = () => tab(2);

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const d = {dni:$('dni').value.trim(), apellidos:$('apellidos').value.trim(), nombres:$('nombres').value.trim(),
    grado:$('grado').value, modalidad:$('modalidad').value, institucion:$('institucion').value.trim(),
    correo:$('correo').value.trim(), telefono:$('telefono').value.trim()};
  if(!/^\d{8}$/.test(d.dni)) return mostrar($('msg'),'El DNI debe tener 8 dígitos.','bad');
  if(!d.apellidos||!d.nombres||!d.grado||!d.modalidad||!d.institucion) return mostrar($('msg'),'Completa todos los campos.','bad');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.correo)) return mostrar($('msg'),'Escribe un correo válido.','bad');
  if(!/^9\d{8}$/.test(d.telefono)) return mostrar($('msg'),'El celular debe tener 9 dígitos y empezar con 9.','bad');
  if(!$('acepto').checked) return mostrar($('msg'),'Debes aceptar el tratamiento de datos personales.','bad');
  $('enviar').disabled = true; $('enviar').textContent = 'Enviando…';
  try{
    const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)});
    const j = await r.json();
    if(j.ok){
      $('f').classList.add('hidden'); $('ok').classList.remove('hidden');
      $('okNombre').textContent = j.nombre; $('okCodigo').textContent = j.codigo;
    } else mostrar($('msg'), j.error || 'No se pudo registrar.', 'bad');
  }catch(err){ mostrar($('msg'),'Sin conexión con el servidor. Intenta de nuevo.','bad'); }
  $('enviar').disabled = false; $('enviar').textContent = 'Inscribirme';
});

$('buscar').onclick = async () => {
  const dni = $('dniC').value.trim();
  if(!/^\d{8}$/.test(dni)) return mostrar($('res'),'El DNI debe tener 8 dígitos.','bad');
  $('buscar').disabled = true; mostrar($('res'),'Buscando…','good');
  try{
    const j = await (await fetch(API+'?accion=consulta&dni='+dni)).json();
    if(!j.ok) mostrar($('res'), j.error, 'bad');
    else if(j.inscrito) mostrar($('res'), 'INSCRITO — ' + j.nombre + ' (código ' + j.codigo + ')', 'good');
    else mostrar($('res'), 'NO INSCRITO — no hay registro con ese DNI.', 'bad');
  }catch(err){ mostrar($('res'),'No se pudo consultar. Intenta de nuevo.','bad'); }
  $('buscar').disabled = false;
};
</script>
</body>
</html>
